<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>필름 · 다꾸 프레임 변환기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      background: #f6f4ef;
      color: #222;
      min-height: 100vh;
      padding: 20px 16px 40px;
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 18px; }
    header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    header p { font-size: 13px; color: #777; margin-top: 4px; }
    .preview-box {
      background: #eae6dd;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      margin-bottom: 16px;
    }
    .placeholder { text-align: center; color: #888; font-size: 14px; line-height: 1.6; }
    canvas {
      max-width: 100%;
      max-height: 440px;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      display: none;
    }
    .btn-upload {
      display: block; width: 100%; padding: 13px;
      background: #222; color: #fff; text-align: center;
      border-radius: 12px; font-size: 15px; font-weight: 600;
      cursor: pointer; margin-bottom: 14px;
    }
    input[type="file"] { display: none; }
    .section {
      background: #fff; border-radius: 14px; padding: 14px;
      margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .section-title { font-size: 12px; font-weight: 700; color: #888; margin-bottom: 10px; }
    .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      flex: 1 1 auto; padding: 9px 10px;
      border: 1.5px solid #e5e2da; background: #faf9f6;
      border-radius: 10px; font-size: 13px; font-weight: 600; color: #444;
      cursor: pointer; text-align: center;
    }
    .chip.active { border-color: #222; background: #222; color: #fff; }
    .field-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .field-row input[type="text"] {
      flex: 1; min-width: 160px; padding: 10px 12px;
      border: 1.5px solid #e5e2da; border-radius: 10px; font-size: 14px; outline: none;
    }
    .toggle-btn {
      padding: 10px 12px; border: 1.5px solid #e5e2da; background: #faf9f6;
      border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .toggle-btn.active { border-color: #e86a2c; background: #fff3ec; color: #d95314; }
    .btn-save {
      width: 100%; padding: 14px; background: #e86a2c; color: #fff;
      border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 4px; opacity: 0.4; pointer-events: none;
    }
    .btn-save.ready { opacity: 1; pointer-events: auto; }
    footer { text-align: center; font-size: 11px; color: #999; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🎞️ 필름 · 다꾸 프레임 변환기</h1>
      <p>사진은 서버에 저장되지 않고 내 기기에서만 처리돼요</p>
    </header>
    <div class="preview-box">
      <div class="placeholder" id="placeholder">아래에서 사진을 고르면<br />바로 필름 색감 + 다꾸 프레임이 입혀져요</div>
      <canvas id="canvas"></canvas>
    </div>
    <label class="btn-upload">사진 고르기<input type="file" id="fileInput" accept="image/*" /></label>

    <div class="section">
      <div class="section-title">필름 색감 & 효과</div>
      <div class="chip-row" id="filterRow">
        <button class="chip active" data-filter="none">원본</button>
        <button class="chip" data-filter="kodak">코닥 웜톤</button>
        <button class="chip" data-filter="fuji">후지 쿨톤</button>
        <button class="chip" data-filter="vintage">빈티지 페이드</button>
        <button class="chip" data-filter="mono">흑백 400</button>
      </div>
      <div class="field-row">
        <button class="toggle-btn" id="leakToggle">필름 빛샘 OFF</button>
        <button class="toggle-btn active" id="dateToggle">날짜 스탬프 ON</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">프레임 & 다꾸 스티커</div>
      <div class="chip-row" id="frameRow">
        <button class="chip active" data-frame="polaroid">폴라로이드</button>
        <button class="chip" data-frame="washi">마스킹테이프</button>
        <button class="chip" data-frame="film35">블랙 35mm</button>
        <button class="chip" data-frame="none">프레임 없음</button>
      </div>
      <div class="chip-row" id="stickerRow" style="margin-top:10px;">
        <button class="chip active" data-sticker="none">스티커 없음</button>
        <button class="chip" data-sticker="cat">🐱 고양이</button>
        <button class="chip" data-sticker="ribbon">🎀 리본</button>
        <button class="chip" data-sticker="coffee">☕ 커피</button>
      </div>
      <div class="chip-row" id="stickerPosRow" style="margin-top:8px;">
        <button class="chip active" data-pos="bl">좌하단</button>
        <button class="chip" data-pos="br">우하단</button>
        <button class="chip" data-pos="tl">좌상단</button>
        <button class="chip" data-pos="tr">우상단</button>
      </div>
      <div class="chip-row" id="stickerSizeRow" style="margin-top:8px;">
        <button class="chip" data-size="0.15">작게</button>
        <button class="chip active" data-size="0.22">보통</button>
        <button class="chip" data-size="0.30">크게</button>
      </div>
      <div class="field-row">
        <input type="text" id="captionInput" placeholder="프레임 하단 한 줄 메모 (선택)" maxlength="40" />
      </div>
    </div>

    <button class="btn-save" id="saveBtn">이미지 저장하기 (PNG)</button>
    <footer>Prototype v0.3 · 100% Browser-side</footer>
  </div>

    };
    const stickerImgs = {};
    Object.keys(STICKERS).forEach(k => {
      const im = new Image();
      im.src = STICKERS[k];
      stickerImgs[k] = im;
    });

    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const placeholder = document.getElementById('placeholder');
    const saveBtn = document.getElementById('saveBtn');
    const captionInput = document.getElementById('captionInput');
    const dateToggle = document.getElementById('dateToggle');
    const leakToggle = document.getElementById('leakToggle');

    let loadedImg = null;
    let currentFilter = 'none';
    let currentFrame = 'polaroid';
    let currentSticker = 'none';
    let stickerPos = 'bl';
    let stickerScale = 0.22;
    let showDate = true;
    let showLeak = false;

    function getTodayStamp() {
      const d = new Date();
      return `'${String(d.getFullYear()).slice(2)} ${String(d.getMonth()+1).padStart(2,'0')} ${String(d.getDate()).padStart(2,'0')}`;
    }

    function bindChips(rowId, attr, cb) {
      document.getElementById(rowId).addEventListener('click', (e) => {
        if (!e.target.dataset[attr]) return;
        document.querySelectorAll(`#${rowId} .chip`).forEach(c => c.classList.remove('active'));
        e.target.classList.add('active');
        cb(e.target.dataset[attr]);
        render();
      });
    }
    bindChips('filterRow', 'filter', v => currentFilter = v);
    bindChips('frameRow', 'frame', v => currentFrame = v);
    bindChips('stickerRow', 'sticker', v => currentSticker = v);
    bindChips('stickerPosRow', 'pos', v => stickerPos = v);
    bindChips('stickerSizeRow', 'size', v => stickerScale = parseFloat(v));

    captionInput.addEventListener('input', render);
    dateToggle.addEventListener('click', () => {
      showDate = !showDate;
      dateToggle.classList.toggle('active', showDate);
      dateToggle.textContent = showDate ? '날짜 스탬프 ON' : '날짜 스탬프 OFF';
      render();
    });
    leakToggle.addEventListener('click', () => {
      showLeak = !showLeak;
      leakToggle.classList.toggle('active', showLeak);
      leakToggle.textContent = showLeak ? '필름 빛샘 ON' : '필름 빛샘 OFF';
      render();
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          loadedImg = img;
          placeholder.style.display = 'none';
          canvas.style.display = 'block';
          saveBtn.classList.add('ready');
          render();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function applyFilmTone(imageData, type) {
      const d = imageData.data;
      for (let i = 0; i < d.length; i += 4) {
        let r = d[i], g = d[i + 1], b = d[i + 2];
        const grain = (Math.random() - 0.5) * 14;
        if (type === 'kodak') {
          r = r * 1.08 + 10; g = g * 1.02 + 4; b = b * 0.90 - 4;
        } else if (type === 'fuji') {
          r = r * 0.94; g = g * 1.04 + 4; b = b * 1.06 + 6;
        } else if (type === 'vintage') {
          r = r * 0.90 + 28; g = g * 0.88 + 24; b = b * 0.80 + 22;
        } else if (type === 'mono') {
          const gray = r * 0.299 + g * 0.587 + b * 0.114;
          const c = ((gray - 128) * 1.15) + 128;
          r = g = b = c;
        }
        if (type !== 'none') { r += grain; g += grain; b += grain; }
        d[i] = Math.max(0, Math.min(255, r));
        d[i + 1] = Math.max(0, Math.min(255, g));
        d[i + 2] = Math.max(0, Math.min(255, b));
      }
      return imageData;
    }

    function drawWashiTape(cx, cy, angle, len, wid, color) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.fillStyle = color;
      ctx.fillRect(-len/2, -wid/2, len, wid);
      ctx.restore();
    }

    function render() {
      if (!loadedImg) return;
      const maxDim = 1200;
      let w = loadedImg.width, h = loadedImg.height;
      if (w > maxDim || h > maxDim) {
        const ratio = Math.min(maxDim / w, maxDim / h);
        w = Math.round(w * ratio); h = Math.round(h * ratio);
      }
      const off = document.createElement('canvas');
      off.width = w; off.height = h;
      const octx = off.getContext('2d');
      octx.drawImage(loadedImg, 0, 0, w, h);
      if (currentFilter !== 'none') {
        const imgData = octx.getImageData(0, 0, w, h);
        octx.putImageData(applyFilmTone(imgData, currentFilter), 0, 0);
      }
      if (showLeak) {
        const grad = octx.createRadialGradient(w * 0.08, h * 0.15, 10, w * 0.15, h * 0.25, w * 0.65);
        grad.addColorStop(0, 'rgba(255, 110, 30, 0.55)');
        grad.addColorStop(0.45, 'rgba(255, 175, 70, 0.22)');
        grad.addColorStop(1, 'rgba(255, 100, 20, 0)');
        octx.globalCompositeOperation = 'screen';
        octx.fillStyle = grad;
        octx.fillRect(0, 0, w, h);
        octx.globalCompositeOperation = 'source-over';
      }

      let padTop = 0, padSide = 0, padBottom = 0;
      if (currentFrame === 'polaroid') {
        padSide = Math.round(w * 0.06); padTop = padSide; padBottom = Math.round(w * 0.20);
      } else if (currentFrame === 'washi') {
        padSide = Math.round(w * 0.08); padTop = padSide; padBottom = Math.round(w * 0.16);
      } else if (currentFrame === 'film35') {
        padSide = Math.round(w * 0.045); padTop = Math.round(w * 0.07); padBottom = Math.round(w * 0.07);
      }

      canvas.width = w + padSide * 2;
      canvas.height = h + padTop + padBottom;

      if (currentFrame === 'polaroid') {
        ctx.fillStyle = '#fcfbf8'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else if (currentFrame === 'washi') {
        ctx.fillStyle = '#fbf7f0'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(225, 205, 185, 0.45)'; ctx.lineWidth = 1;
        const step = Math.round(w * 0.04);
        for (let x = 0; x < canvas.width; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
        for (let y = 0; y < canvas.height; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
      } else if (currentFrame === 'film35') {
        ctx.fillStyle = '#141414'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      ctx.drawImage(off, padSide, padTop);

      if (currentFrame === 'washi') {
        const tl = Math.round(w * 0.18), tw = Math.round(w * 0.055);
        drawWashiTape(padSide + tl * 0.15, padTop, -0.55, tl, tw, 'rgba(255, 190, 175, 0.78)');
        drawWashiTape(padSide + w - tl * 0.15, padTop + h, -0.55, tl, tw, 'rgba(180, 215, 195, 0.78)');
      }

      if (showDate) {
        const fontSize = Math.max(16, Math.round(w * 0.032));
        ctx.font = `bold ${fontSize}px "Courier New", monospace`;
        ctx.fillStyle = 'rgba(255, 128, 40, 0.9)';
        ctx.shadowColor = 'rgba(255, 90, 0, 0.5)'; ctx.shadowBlur = 4;
        ctx.textAlign = 'right';
        ctx.fillText(getTodayStamp(), padSide + w - Math.round(w * 0.03), padTop + h - Math.round(h * 0.035));
        ctx.shadowBlur = 0;
      }

      if ((currentFrame === 'polaroid' || currentFrame === 'washi') && captionInput.value.trim()) {
        const capSize = Math.max(18, Math.round(w * 0.042));
        ctx.font = `500 ${capSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
        ctx.fillStyle = '#444'; ctx.textAlign = 'center';
        ctx.fillText(captionInput.value.trim(), canvas.width / 2, padTop + h + padBottom * 0.58);
      }

      if (currentSticker !== 'none' && stickerImgs[currentSticker] && stickerImgs[currentSticker].complete) {
        const sSize = Math.round(w * stickerScale);
        const margin = Math.round(w * 0.03);
        let sx = padSide + margin;
        let sy = padTop + h - Math.round(sSize * 0.75);
        if (stickerPos === 'br') {
          sx = padSide + w - sSize - margin;
        } else if (stickerPos === 'tl') {
          sy = padTop + margin;
        } else if (stickerPos === 'tr') {
          sx = padSide + w - sSize - margin;
          sy = padTop + margin;
        }
        ctx.drawImage(stickerImgs[currentSticker], sx, sy, sSize, sSize);
      }
    }

    saveBtn.addEventListener('click', () => {
      if (!loadedImg) return;
      const link = document.createElement('a');
      link.download = `film-frame-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
